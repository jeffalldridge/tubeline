name: Tubeline
options:
  bundleIdPrefix: com.tentstudios
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

# The geometry engine is the Swift package at the repo root, shared with the
# `tubeline` command-line tool.
packages:
  TubelineCore:
    path: ..

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ACL5A8Y9U7
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    # Apple silicon only (decision 2026-10-22): the mesher is tuned for many-core arm64.
    ARCHS: arm64

targets:
  Tubeline:
    type: application
    platform: macOS
    sources:
      - path: Tubeline
    dependencies:
      - package: TubelineCore
        product: TubelineCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tentstudios.tubeline
        PRODUCT_NAME: Tubeline
        # Hand-written plist carries document types (Dock drop / Open With) and
        # copyright; INFOPLIST_KEY_* is ignored when a custom plist is set.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Tubeline/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tubeline/Resources/Tubeline.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: true
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SELECTED_FILES: readwrite
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    # Xcode auto-generates an INCOMPLETE legacy AppIcon.icns from the Icon
    # Composer source (Resources/AppIcon.icon) and injects CFBundleIconFile;
    # App Store validation then fails with error 90236. Strip both so only the
    # modern Assets.car icon is used. inputFiles force this to run after
    # Info.plist processing (sibling-proven; see readermd-app/project.yml).
    # Do NOT enable ENABLE_USER_SCRIPT_SANDBOXING: this script writes inside
    # the built app without declared outputs.
    postBuildScripts:
      - name: "Strip incomplete legacy AppIcon.icns (use modern Assets.car only)"
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/AppIcon.icns"
        script: |
          set -euo pipefail
          APP_PATH="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app"
          ICNS="$APP_PATH/Contents/Resources/AppIcon.icns"
          PLIST="$APP_PATH/Contents/Info.plist"
          if [ -f "$ICNS" ]; then
              rm -f "$ICNS"
              echo "Removed incomplete legacy AppIcon.icns"
          fi
          if [ -f "$PLIST" ]; then
              /usr/libexec/PlistBuddy -c "Delete :CFBundleIconFile" "$PLIST" 2>/dev/null || true
              echo "Stripped stale CFBundleIconFile from Info.plist"
          fi

  TubelineTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TubelineTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tentstudios.tubeline.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Tubeline
      - package: TubelineCore
        product: TubelineCore

schemes:
  Tubeline:
    build:
      targets:
        Tubeline: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TubelineTests
