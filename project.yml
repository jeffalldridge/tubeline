name: Tubeline
options:
  bundleIdPrefix: app.tubeline
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  TubelineCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Tubeline:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: Sources/TubelineApp
      - path: App
    dependencies:
      - package: TubelineCore
        product: TubelineCore
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_IDENTITY: "-"
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
schemes:
  Tubeline:
    build:
      targets:
        Tubeline: all
    run:
      config: Debug
    archive:
      config: Release
