name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Apple silicon runner with Xcode 26 (Icon Composer icons, MainActor-default isolation).
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Engine and CLI
        run: swift build -c release --product tubeline

      - name: Engine tests
        run: swift test

      - name: Convert samples and validate USDZ
        run: |
          .build/release/tubeline Samples -o "$RUNNER_TEMP/out"
          for f in "$RUNNER_TEMP"/out/*.usdz; do usdchecker --arkit "$f"; done

      - name: App tests
        run: |
          cd app
          xcodegen generate
          xcodebuild -project Tubeline.xcodeproj -scheme Tubeline \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO test
