name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Apple silicon runner with Xcode 26 (Icon Composer icons, MainActor-default isolation).
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Engine and CLI
        run: swift build -c release --product tubeline

      - name: CLI output safety
        run: bash scripts/test-cli-output.sh

      - name: Engine tests
        run: swift test

      - name: Convert samples and validate USDZ and GLB
        run: |
          .build/release/tubeline Samples -o "$RUNNER_TEMP/out" --format both
          for f in "$RUNNER_TEMP"/out/*.usdz; do usdchecker --arkit "$f"; done
          # The script resolves gltf-validator from its own folder, so it runs from there.
          npm install --no-save --prefix "$RUNNER_TEMP/validator" gltf-validator@2.0.0-dev.3.10
          cp scripts/validate-glb.mjs "$RUNNER_TEMP/validator/"
          node "$RUNNER_TEMP/validator/validate-glb.mjs" "$RUNNER_TEMP"/out/*.glb

      - name: App tests
        run: |
          cd app
          xcodegen generate
          xcodebuild -project Tubeline.xcodeproj -scheme Tubeline \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO test
